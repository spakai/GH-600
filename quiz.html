function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function button(text, action, className) {
  const node = element("button", text, className);
  node.type = "button";
  node.addEventListener("click", action);
  return node;
}

  const answered = answers.filter(answer => answer !== null).length;
  const correct = answers.filter((answer, index) => answer === questions[index].answer).length;

    const heading = element("h2", "Your results");
    heading.id = "question-title";
    quiz.append(heading);
    quiz.append(element("p", `${correct} correct out of ${answered} answered. ${questions.length - answered} unanswered.`));
    quiz.append(element("p", "Use Review questions to revisit your answers or complete any skipped questions."));
    const controls = element("div", undefined, "controls");
    controls.append(button("Review questions", () => { showingResults = false; current = 0; render(); }));
    controls.append(button("Start over", reset, "primary"));
    quiz.append(controls);
    return;
  }

  const item = questions[current];
  quiz.append(element("p", `Question ${current + 1} of ${questions.length} · ${item.topic}`, "meta"));
  const heading = element("h2", item.question);
  heading.id = "question-title";
  quiz.append(heading);
  const options = element("div", undefined, "options");
  item.options.forEach(([text], index) => {
    const choice = button(`${String.fromCharCode(65 + index)}. ${text}`, () => {
      answers[current] = index;
      render();
    }, "option");
    if (answers[current] !== null) {
      choice.disabled = true;
      if (index === item.answer) choice.classList.add("correct");
      else if (index === answers[current]) choice.classList.add("incorrect");
    }
    options.append(choice);
  });
  quiz.append(options);

  if (answers[current] !== null) {
    const feedback = element("div", undefined, "feedback");
    feedback.setAttribute("role", "status");
    const selected = answers[current];
    feedback.append(element("h3", selected === item.answer ? "Correct" : `Not quite — the correct answer is ${String.fromCharCode(65 + item.answer)}.`));
    const explanations = element("ul");
    item.options.forEach(([text, explanation], index) => {
      const entry = element("li");
      const label = element("strong", `${String.fromCharCode(65 + index)}. ${text} `);
      entry.append(label, document.createTextNode(explanation));
      explanations.append(entry);
    });
    feedback.append(explanations);
    quiz.append(feedback);
  }

  const controls = element("div", undefined, "controls");
  const previous = button("Previous", () => { current--; render(); });
  previous.disabled = current === 0;
  controls.append(previous);
  controls.append(button(current === questions.length - 1 ? "View results" : "Next", () => {
    if (current === questions.length - 1) showingResults = true;
    else current++;
    render();
  }, "primary"));
  quiz.append(controls);
}

function reset() {
  if (!confirm("Clear all answers and start over?")) return;
  answers.fill(null);
  current = 0;
  showingResults = false;
  render();
}

render();
</script>
</body>
</html>
